# Evo 匿名统计的接收程序（Cloudflare Worker），说明见 worker.js。部署：cd server/stats && wrangler deploy
name = "evo-stats"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = false  # 只用自己的域名（国内连不上 workers.dev）
preview_urls = false

routes = [
  { pattern = "stats.evotracker.cn", custom_domain = true },
]

[triggers]
crons = ["7 0 * * *", "* * * * *"]  # 每天 UTC 0 点第 7 分钟重算全体玩家的汇总（D1 的免费额度 UTC 0 点恢复，放在刚恢复的时候，不会因为额度用完算不了；没有新数据、没换天就不算；2026-10-29 从每小时改成每 6 小时，2026-11-08 额度超限后改成每天一次）；每分钟看一眼地图轮换要不要重新取（到了换图的时间才去取，见 worker.js 的 refreshMaps）

[[d1_databases]]
binding = "DB"
database_name = "evo-stats"
database_id = "909dfd16-857d-45fa-96cd-bc828da97e29"  # 2026-10-22 建的，在亚太地区（APAC）

[observability]
enabled = false  # 不记请求日志（里面会有 IP 地址）
