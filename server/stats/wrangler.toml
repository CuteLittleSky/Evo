# Evo 匿名统计的接收程序（Cloudflare Worker），说明见 worker.js。部署：cd server/stats && wrangler deploy
name = "evo-stats"
main = "worker.js"
compatibility_date = "2026-06-01"
workers_dev = false  # 只用自己的域名（国内连不上 workers.dev）
preview_urls = false

routes = [
  { pattern = "stats.evotracker.cn", custom_domain = true },
]

[triggers]
crons = ["7 * * * *", "* * * * *"]  # 每小时第 7 分钟增量更新全体玩家汇总的中间结果，每个 UTC 日子第一次（0 点第 7 分钟）出汇总（2026-11-19 改成增量算，见 worker.js 的 refreshSummary；以前从头算，2026-10-29 从每小时改成每 6 小时，2026-11-08 额度超限后改成每天一次）；每分钟看一眼地图轮换要不要重新取（到了换图的时间才去取，见 worker.js 的 refreshMaps）

[[d1_databases]]
binding = "DB"
database_name = "evo-stats"
database_id = "909dfd16-857d-45fa-96cd-bc828da97e29"  # 2026-10-22 建的，在亚太地区（APAC）

[observability]
enabled = false  # 不记请求日志（里面会有 IP 地址）
